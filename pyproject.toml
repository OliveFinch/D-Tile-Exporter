[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilearc"
version = "0.1.0"
description = "Polite command-line archiver for historical Disney park map tiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "PySide6>=6.6"]

[project.scripts]
tilearc = "tilearc.cli:main"

[project.gui-scripts]
tilearc-gui = "tilearc_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tilearc.*"]
